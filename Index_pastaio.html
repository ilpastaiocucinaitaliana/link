<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<title>Arena Café — Gestión</title>
<style>
  :root{--bg:#F3F0EB;--surface:#fff;--surface-2:#FAF8F4;--sunken:#EEE9E1;--ink:#211D18;--muted:#6B6055;--faint:#A79C8C;
    --border:#E2DBD0;--border-strong:#D2C8B8;--brand:#6E4326;--brand-ink:#FBF6F0;--pos:#2E7D57;--pos-soft:#E4F1EA;
    --warn:#B9721F;--warn-soft:#F7ECDA;--danger:#BB392C;--danger-soft:#F7E2DE;--info:#2A6C8C;--info-soft:#E1EDF3;
    --shadow:0 1px 2px rgba(33,29,24,.06),0 6px 20px rgba(33,29,24,.05);--r:10px;--r-sm:7px;
    --f:"Barlow",system-ui,-apple-system,sans-serif;--fm:ui-monospace,"IBM Plex Mono",monospace;}
  @media(prefers-color-scheme:dark){:root{--bg:#181512;--surface:#221E1A;--surface-2:#26221D;--sunken:#141110;--ink:#EFE9E0;--muted:#A99E8E;--faint:#7A7062;--border:#332D26;--border-strong:#433A31;--brand:#C79063;--brand-ink:#1E1611;--pos:#54B487;--pos-soft:#1B2E25;--warn:#D69A44;--warn-soft:#332613;--danger:#DB6255;--danger-soft:#331C18;--info:#5C9EBE;--info-soft:#152730;}}
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;-webkit-font-smoothing:antialiased}
  button,select,input{font-family:inherit}.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}
  .topbar{position:sticky;top:0;z-index:40;background:var(--brand);color:var(--brand-ink);display:flex;align-items:center;gap:12px;padding:9px 14px;flex-wrap:wrap}
  .brand{font-weight:700;font-size:18px;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
  .brand .m{width:28px;height:28px;border-radius:7px;background:var(--brand-ink);color:var(--brand);display:grid;place-items:center;font-weight:700}
  .sp{flex:1}
  .chip{display:flex;flex-direction:column;background:rgba(255,255,255,.13);border-radius:7px;padding:3px 9px;line-height:1.15}
  .chip label{font-size:9px;text-transform:uppercase;letter-spacing:.1em;opacity:.7}
  .chip select{background:transparent;border:0;color:inherit;font-weight:600;font-size:13px;outline:none}
  .chip select option{color:#211}
  nav{display:flex;gap:2px;padding:0 8px;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;position:sticky;top:50px;z-index:30}
  nav button{background:none;border:0;color:var(--muted);font-weight:600;font-size:14px;padding:11px 12px 9px;border-bottom:2.5px solid transparent;white-space:nowrap}
  nav button.on{color:var(--brand);border-bottom-color:var(--brand)}
  nav .bdg{background:var(--warn);color:#fff;border-radius:20px;font-size:10px;padding:1px 6px;margin-left:4px}
  main{max-width:1100px;margin:0 auto;padding:16px}
  h1{font-size:22px;margin:0 0 2px}.sub{color:var(--muted);font-size:12.5px;margin:0 0 14px}
  .btn{border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);border-radius:var(--r-sm);padding:8px 12px;font-weight:600;font-size:13px;display:inline-flex;gap:6px;align-items:center}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}.btn.pos{background:var(--pos);border-color:var(--pos);color:#fff}
  .btn.info{background:var(--info);border-color:var(--info);color:#fff}.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
  .btn.sm{padding:5px 9px;font-size:12px}.btn:disabled{opacity:.45}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
  .ph{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--border);font-weight:700}
  table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:8px 12px;border-bottom:1px solid var(--border)}
  td{padding:9px 12px;border-bottom:1px solid var(--border)}tr:last-child td{border-bottom:0}.r{text-align:right}.c{text-align:center}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;text-transform:uppercase}
  .tag.pos{background:var(--pos-soft);color:var(--pos)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.info{background:var(--info-soft);color:var(--info)}.tag.mut{background:var(--sunken);color:var(--muted)}.tag.danger{background:var(--danger-soft);color:var(--danger)}
  .sx{overflow-x:auto}.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
  .field label{font-size:11px;font-weight:600;text-transform:uppercase;color:var(--muted)}
  .field input,.field select{border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);border-radius:var(--r-sm);padding:8px 10px;font-size:14px}
  .qin{width:70px;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);border-radius:6px;padding:5px;text-align:right;font-family:var(--fm)}
  .scrim{position:fixed;inset:0;background:rgba(20,17,14,.5);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
  .modal{background:var(--surface);border-radius:14px;max-width:640px;width:100%;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .mh{padding:13px 16px;border-bottom:1px solid var(--border);font-weight:700;font-size:17px}.mb{padding:14px 16px;overflow:auto}.mf{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;background:var(--surface-2)}
  .empty{text-align:center;color:var(--faint);padding:26px}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;font-weight:600;z-index:80;box-shadow:0 10px 30px rgba(0,0,0,.3)}
  .toast.pos{background:var(--pos);color:#fff}.toast.danger{background:var(--danger);color:#fff}
  .load{display:grid;place-items:center;height:60vh;color:var(--muted)}
  .note{background:var(--info-soft);border:1px solid var(--info);border-radius:var(--r);padding:10px 12px;font-size:12.5px;margin-bottom:14px}
  .npr{max-height:46vh;overflow:auto;border:1px solid var(--border);border-radius:var(--r-sm);margin:-4px 0 12px;background:var(--surface-2)}
  .npcat{position:sticky;top:0;background:var(--brand);color:var(--brand-ink);font-size:11px;font-weight:700;text-transform:uppercase;padding:4px 10px;letter-spacing:.5px}
  .npsearch{width:100%;padding:9px 11px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);color:var(--ink);font-size:14px;margin-bottom:8px}
  .npselwrap{background:var(--surface-2);border:2px solid var(--brand);border-radius:10px;padding:8px 10px;margin-bottom:12px;max-height:34vh;overflow:auto}
  .npsel-h{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--brand);margin-bottom:6px;display:flex;gap:6px;align-items:center}
  .npselrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)}
  .npselrow:last-child{border-bottom:0}
  .npseln{flex:1;font-size:13.5px;font-weight:600;min-width:0;overflow-wrap:anywhere}
  .npselu{font-size:11px;color:var(--faint);min-width:34px}
  .npselwrap .qin{width:60px;font-size:16px}
  .npr2{max-height:58vh;overflow:auto;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface-2)}
  .npi2{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--border)}
  .npi2:last-child{border-bottom:0}
  .npi2n{flex:1;font-size:13.5px;min-width:0;overflow-wrap:anywhere}
  .npi2.sel{background:var(--info-soft)}
  .npi2.sel .npi2n{font-weight:700}
  .npq{width:56px;font-size:16px;text-align:right}
  .npq-u{border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);border-radius:6px;padding:4px 4px;font-size:12px;max-width:78px}
  .npi2 .npu{color:var(--faint);font-size:11px}
  .npr:empty{display:none}
  .npi{padding:9px 12px;font-size:14px;cursor:pointer;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px}
  .npi:last-child{border-bottom:0}
  .npi:hover{background:var(--info-soft)}
  .npu{margin-left:auto;font-size:11px;color:var(--faint);font-family:var(--fm)}
  .npempty{color:var(--faint);cursor:default}.npempty:hover{background:transparent}
  .segs{display:flex;gap:6px;flex-wrap:wrap}
  .seg{border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);border-radius:20px;padding:7px 14px;font-weight:600;font-size:13px;cursor:pointer}
  .seg.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
  .who{display:flex;align-items:center}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px}
  .kpi .kl{font-size:11px;font-weight:600;text-transform:uppercase;color:var(--muted)}
  .kpi .kv{font-size:20px;font-weight:800;font-family:var(--fm);margin-top:2px}
  #printArea{display:none}
  @media print{
    body{background:#fff}
    .topbar,nav,main,#modalRoot,#loginRoot{display:none!important}
    #printArea{display:block!important;padding:0;color:#000;font-family:Arial,sans-serif}
    .pk-h{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:10px}
    .pk-b{font-size:22px;font-weight:bold}.pk-t{font-size:18px;letter-spacing:2px}
    .pk-meta{width:100%;font-size:12px;margin-bottom:12px;border-collapse:collapse}
    .pk-meta td{padding:2px 0}
    .pk-items{width:100%;border-collapse:collapse;font-size:12px}
    .pk-items th,.pk-items td{border:1px solid #000;padding:5px 7px;text-align:left}
    .pk-items th{background:#eee}
    .pk-items .n,.pk-items td.n{text-align:right;width:60px}.pk-items .u{width:80px}
    .pk-f{display:flex;justify-content:space-between;margin-top:40px;font-size:12px}
  }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><div class="m">P</div>IL PASTAIO</div>
  <div class="sp"></div>
  <div class="chip" id="chipSuc" style="display:none"><label>Sucursal</label><select id="selSuc" onchange="setSuc(this.value)"></select></div>
  <div id="whoami" class="who"></div>
  <button class="btn sm" style="background:rgba(255,255,255,.15);border:0;color:inherit" onclick="reload()" title="Actualizar">↻</button>
  <button class="btn sm" id="btnSalir" style="background:rgba(255,255,255,.15);border:0;color:inherit;display:none" onclick="salir()">Salir</button>
</div>
<nav id="nav"></nav>
<main id="main"><div class="load">Cargando datos de Google Sheets…</div></main>
<div id="modalRoot"></div>
<div id="loginRoot"></div>
<div id="printArea"></div>

<script>
/* ================= estado y utilidades ================= */
var APP_MODO="<?= MODO ?>";  // FULL (link tuyo) o LOC (link para locales)
var DATA=null, ROL=null, SUC='RIGLOS', VIEW='pedidos', USUARIO='', DEV_TIPO='COMPU';
var LOCALES=[['RIGLOS','Riglos'],['MITRE','E. Mitre'],['CENTRAL','Prod. Central']];
function sucName(c){var m={RIGLOS:'Riglos',MITRE:'E. Mitre',CENTRAL:'Prod. Central'};return m[c]||c;}
function sucNorm(v){v=String(v||'').toUpperCase();if(v.indexOf('RIGLOS')>=0)return'RIGLOS';if(v.indexOf('MITRE')>=0)return'MITRE';if(v.indexOf('CENTRAL')>=0||v==='CP')return'CENTRAL';return v;}
function money(n){n=Number(n)||0;return new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(Math.round(n));}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function num(v){v=String(v==null?'':v).replace(/[^0-9.,-]/g,'');if(v.indexOf(',')>-1&&v.indexOf('.')>-1)v=v.replace(/\./g,'').replace(',','.');else if(v.indexOf(',')>-1)v=v.replace(',','.');return parseFloat(v)||0;}
function toast(m,k){var t=document.createElement('div');t.className='toast'+(k?' '+k:'');t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.style.opacity=0;t.style.transition='.3s';setTimeout(function(){t.remove();},300);},2200);}
function run(fn){return function(){var a=[].slice.call(arguments);return new Promise(function(res,rej){google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn].apply(google.script.run,a);});};}
function deviceId(){try{var k=localStorage.getItem('pastaio_dev');if(!k){k='D'+Date.now().toString(36)+Math.random().toString(36).slice(2,10);localStorage.setItem('pastaio_dev',k);}return k;}catch(e){return 'D-nostorage';}}
/* Cantidad: entiende 0.5 · 0,5 · 1/2 · 1 1/2 */
function parseCant(v){
  v=String(v==null?'':v).trim().replace(',','.');
  var m=v.match(/^(\d+(?:\.\d+)?)?\s*(\d+)\s*\/\s*(\d+)$/);
  if(m){ var w=m[1]?parseFloat(m[1]):0, b=parseFloat(m[3]); return b?w+parseFloat(m[2])/b:w; }
  return parseFloat(v.replace(/[^0-9.]/g,''))||0;
}
function fmtCant(n){ n=Number(n)||0; return (Math.round(n*100)/100).toString(); }

/* modal */
function modal(html,sticky){document.getElementById('modalRoot').innerHTML='<div class="scrim"'+(sticky?'':' onclick="if(event.target===this)closeM()"')+'><div class="modal">'+html+'</div></div>';}
function closeM(){document.getElementById('modalRoot').innerHTML='';}

/* ================= arranque ================= */
async function reload(){
  try{
    var raw = await run('getBootstrap')(deviceId());
    DATA = (typeof raw==='string') ? JSON.parse(raw) : raw;
    if(!DATA || !DATA.pedidos){ throw new Error('La planilla respondió vacío (revisá permisos).'); }
    gate();
  }catch(e){ document.getElementById('main').innerHTML='<div class="load">No pude leer la planilla.<br>Revisá el ID en Code.gs y los permisos.<br><small>'+esc(e.message||e)+'</small></div>'; }
}
/* Muestra login si nadie ingresó; si ya hay sesión, dibuja la app. */
function gate(){
  if(!ROL){ verLogin(); return; }
  document.getElementById('loginRoot').innerHTML='';
  render();
}
function verLogin(){
  document.getElementById('nav').innerHTML='';
  document.getElementById('main').innerHTML='';
  document.getElementById('whoami').innerHTML='';
  document.getElementById('btnSalir').style.display='none';
  document.getElementById('chipSuc').style.display='none';
  document.getElementById('loginRoot').innerHTML=
    '<div class="scrim" style="background:var(--bg)"><div class="modal" style="max-width:380px">'+
    '<div class="mh" style="text-align:center">🍝 IL PASTAIO · Ingreso'+(APP_MODO==='LOC'?' <span class="tag mut" style="font-size:9px">LOCALES</span>':'')+'</div>'+
    '<div class="mb" style="text-align:center">'+
    '<p class="sub" style="margin-bottom:14px">Ingresá el código</p>'+
    '<form id="lgForm" autocomplete="on" onsubmit="entrar();return false">'+
      '<input id="lgU" name="username" autocomplete="username" value="pastaio-dueno" tabindex="-1" aria-hidden="true" style="position:absolute;left:-9999px;top:0;width:1px;height:1px;opacity:0">'+
      '<div style="position:relative">'+
        '<input id="lgC" name="password" type="password" placeholder="CÓDIGO / PIN" autocomplete="current-password" autocapitalize="characters" style="text-align:center;font-size:18px;letter-spacing:2px;width:100%;padding:12px 44px;border:1px solid var(--border-strong);border-radius:10px;background:var(--surface);color:var(--ink);box-sizing:border-box">'+
        '<button type="button" onclick="verPin()" title="Ver / ocultar" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:18px;cursor:pointer;color:var(--faint)">👁</button>'+
      '</div>'+
      '<div id="lgErr" style="color:var(--danger);font-size:12.5px;height:16px;margin-top:6px"></div>'+
      '<div class="mf" style="justify-content:center;margin-top:4px"><button type="submit" class="btn primary" style="min-width:160px">Entrar</button></div>'+
    '</form>'+
    '<p class="sub" style="font-size:11px;margin-top:8px;color:var(--faint)">En iPhone: guardá el código y entrá con Face ID.</p>'+
    '</div></div></div>';
  var c=document.getElementById('lgC'); try{ c.focus(); }catch(e){}
}
window.verPin=function(){ var c=document.getElementById('lgC'); if(c) c.type = (c.type==='password'?'text':'password'); };
async function entrar(){
  var codigo=(document.getElementById('lgC').value||'').trim();
  if(!codigo)return;
  document.getElementById('lgErr').textContent='';
  var btn=document.querySelector('#loginRoot .btn.primary'); if(btn){btn.disabled=true;btn.textContent='Entrando…';}
  try{
    var r=await run('login')(codigo, navigator.userAgent||'', deviceId());
    if(r&&r.ok){
      if(APP_MODO==='LOC' && r.rol==='dueno'){ document.getElementById('lgErr').textContent='Este enlace es solo para los locales.'; if(btn){btn.disabled=false;btn.textContent='Entrar';} return; }
      ROL=r.rol; SUC=r.suc||'RIGLOS'; DEV_TIPO=(r.tipo||'COMPU'); VIEW='pedidos';
      if(ROL==='local'){ verQuienSos(); return; }
      USUARIO='Dueño'; gate(); return; }
    document.getElementById('lgErr').textContent = (r&&r.motivo==='dispositivo')
      ? 'Este dispositivo no está autorizado. Pedile al dueño que lo habilite.' : 'Código incorrecto';
  }catch(e){ document.getElementById('lgErr').textContent='Error de conexión'; }
  if(btn){btn.disabled=false;btn.textContent='Entrar';}
}
/* Después del código del local: cada persona dice quién es (queda registrado). */
function verQuienSos(){
  var emps=DATA.empleados.filter(function(e){return String(e.ACTIVO).toUpperCase()!=='NO'&&empSuc(e)===SUC;})
    .sort(function(a,b){return String(a.EMPLEADO).localeCompare(String(b.EMPLEADO));});
  var elegidos=emps.filter(function(e){return String(e.INGRESO||'').toUpperCase()==='SI';});
  if(elegidos.length) emps=elegidos;  // si marcaste algunos con INGRESO=SI, mostramos solo esos
  var btns=emps.map(function(e){return '<button class="seg" style="margin:4px" onclick="elegirUsuario(\''+esc(e.EMPLEADO).replace(/'/g,"\\'")+'\')">'+esc(e.EMPLEADO)+'</button>';}).join('');
  document.getElementById('loginRoot').innerHTML=
    '<div class="scrim" style="background:var(--bg)"><div class="modal" style="max-width:440px">'+
    '<div class="mh" style="text-align:center">👋 ¿Quién sos? · '+esc(sucName(SUC))+'</div>'+
    '<div class="mb" style="text-align:center">'+
    '<p class="sub" style="margin-bottom:12px">Tocá tu nombre para registrar tu ingreso</p>'+
    '<div style="display:flex;flex-wrap:wrap;justify-content:center">'+(btns||'<span class="sub">No hay empleados cargados en este local</span>')+'</div>'+
    '<div style="margin-top:12px"><button class="btn ghost sm" onclick="elegirUsuario(\'__otro__\')">Otro / no estoy en la lista</button></div>'+
    '</div><div class="mf" style="justify-content:center"><button class="btn ghost" onclick="salir()">← Volver</button></div>'+
    '</div></div>';
}
async function elegirUsuario(name){
  if(name==='__otro__'){ name=(prompt('Tu nombre:')||'').trim(); if(!name)return; }
  USUARIO=name;
  try{ await run('registrarIngreso')(SUC, name, navigator.userAgent||''); }catch(e){}
  gate();
}
function salir(){ ROL=null; USUARIO=''; DEV_TIPO='COMPU'; VIEW='pedidos'; verLogin(); }
function setSuc(v){SUC=v;render();}

/* ================= navegación ================= */
var MODS=[['pedidos','Pedidos'],['remitos','Remitos'],['recepcion','Recepción'],['articulos','Artículos 🔒'],['proveedores','Proveedores 🔒'],['insumos','Insumos'],['personal','Personal'],['horas','Mis Horas'],['fichas','Fichas 🔒'],['rrhh','RRHH 🔒'],['vencimientos','Vencimientos 🔒'],['facturas','Facturas 🔒'],['gastos','Gastos 🔒'],['caja','Caja 🔒'],['accesos','Accesos 🔒'],['dispositivos','Dispositivos 🔒']];
function itemsDe(pedId){return DATA.pedidoItems.filter(function(x){return String(x.PEDIDO_ID)===String(pedId);});}
function render(){
  document.getElementById('btnSalir').style.display='';
  if(ROL==='dueno'){
    document.getElementById('chipSuc').style.display='';
    document.getElementById('selSuc').innerHTML=LOCALES.map(function(l){return '<option value="'+l[0]+'"'+(l[0]===SUC?' selected':'')+'>'+l[1]+'</option>';}).join('');
    document.getElementById('whoami').innerHTML='<span class="tag" style="background:rgba(255,255,255,.2);color:inherit">🔒 Dueño</span>';
  }else{
    document.getElementById('chipSuc').style.display='none';
    document.getElementById('whoami').innerHTML='<span class="tag" style="background:rgba(255,255,255,.2);color:inherit">💻 '+esc(sucName(SUC))+(USUARIO?' · '+esc(USUARIO):'')+'</span>';
  }
  // Pendientes por solapa (para que "salte a la vista" lo que falta hacer)
  var mios=function(p){return ROL==='dueno'||sucNorm(p.LOCAL)===SUC;};
  var nPed=DATA.pedidos.filter(function(p){return p.ESTADO==='PENDIENTE'&&mios(p);}).length;
  var nRem=DATA.pedidos.filter(function(p){return p.ESTADO==='PENDIENTE'&&(p.ORIGEN==='CENTRAL'||!p.ORIGEN);}).length; // a remitir por depósito

/* --- Ventas por artículo (lee el detalle desde tu planilla CAJA) --- */
async function vCajaVentas(){
  if(!DATA.ventas){
    M(cajaTabs()+'<div class="load">Leyendo ventas por artículo…</div>');
    try{ var raw=await run('getVentas')(deviceId()); DATA.ventas=JSON.parse(raw); }
    catch(e){ M(cajaTabs()+'<div class="empty">No pude leer las ventas por artículo.</div>'); return; }
  }
  var vs=(DATA.ventas||[]).map(function(v){return {suc:sucNorm(v.suc),fecha:String(v.fecha||''),art:v.art,fam:v.familia,cant:num(v.cant),total:num(v.total)};});
  if(!vs.length){ M(cajaTabs()+'<div class="empty">No encontré el detalle de artículos en la planilla CAJA.<br><small>Ejecutá <b>verCaja</b> y pasame el registro.</small></div>'); return; }
  var totGen=0, porSuc={}, porFS={}, porArt={}, porFam={}, fechas={}, sucs={};
  vs.forEach(function(v){
    totGen+=v.total;
    porSuc[v.suc]=(porSuc[v.suc]||0)+v.total; sucs[v.suc]=1; fechas[v.fecha]=1;
    var k=v.fecha+'||'+v.suc; porFS[k]=(porFS[k]||0)+v.total;
    if(!porArt[v.art])porArt[v.art]={c:0,t:0}; porArt[v.art].c+=v.cant; porArt[v.art].t+=v.total;
    porFam[v.fam||'—']=(porFam[v.fam||'—']||0)+v.total;
  });
  var lsuc=Object.keys(sucs).sort(), lfec=Object.keys(fechas).sort();
  // KPIs
  var kpis='<div class="kpis"><div class="kpi"><div class="kl">Venta total</div><div class="kv">'+money(totGen)+'</div></div>'+
    lsuc.map(function(s){return '<div class="kpi"><div class="kl">'+esc(sucName(s))+'</div><div class="kv">'+money(porSuc[s])+'</div></div>';}).join('')+
    '<div class="kpi"><div class="kl">Días</div><div class="kv">'+lfec.length+'</div></div></div>';
  // Tabla fecha x sucursal
  var thd='<tr><th>Fecha</th>'+lsuc.map(function(s){return '<th class="r">'+esc(sucName(s))+'</th>';}).join('')+'<th class="r">Total</th></tr>';
  var trs=lfec.slice().reverse().map(function(f){
    var tf=0; var tds=lsuc.map(function(s){var val=porFS[f+'||'+s]||0;tf+=val;return '<td class="r mono">'+(val?money(val):'—')+'</td>';}).join('');
    return '<tr><td class="mono">'+esc(f)+'</td>'+tds+'<td class="r mono" style="font-weight:700">'+money(tf)+'</td></tr>';
  }).join('');
  var tFecha='<div class="panel"><div class="ph">Ventas por día y sucursal</div><div class="sx"><table>'+thd+trs+'</table></div></div>';
  // Ranking artículos
  var arts=Object.keys(porArt).map(function(a){return {a:a,c:porArt[a].c,t:porArt[a].t};}).sort(function(x,y){return y.t-x.t;});
  var tArt='<div class="panel"><div class="ph">Artículos más vendidos (por $)</div><div class="sx"><table><tr><th>Artículo</th><th class="r">Cant.</th><th class="r">Total</th></tr>'+
    arts.slice(0,40).map(function(r){return '<tr><td>'+esc(r.a)+'</td><td class="r mono">'+(Math.round(r.c*100)/100)+'</td><td class="r mono">'+money(r.t)+'</td></tr>';}).join('')+'</table></div></div>';
  // Por familia
  var fams=Object.keys(porFam).map(function(f){return {f:f,t:porFam[f]};}).sort(function(x,y){return y.t-x.t;});
  var tFam='<div class="panel"><div class="ph">Ventas por familia</div><div class="sx"><table><tr><th>Familia</th><th class="r">Total</th><th class="r">%</th></tr>'+
    fams.map(function(r){return '<tr><td>'+esc(r.f)+'</td><td class="r mono">'+money(r.t)+'</td><td class="r mono">'+(totGen?Math.round(r.t/totGen*100):0)+'%</td></tr>';}).join('')+'</table></div></div>';
  M(cajaTabs()+'<p class="sub">'+vs.length+' líneas · '+lfec.length+' día(s) · <a href="#" onclick="DATA.ventas=null;render();return false" style="color:var(--brand)">↻ recargar ventas</a></p>'+
    kpis+tFecha+tFam+tArt);
}

function origenName(o){if(o==='CENTRAL'||!o)return 'Prod. Central';var p=DATA.proveedores.filter(function(x){return x.CODIGO===o||x.PROVEEDOR===o;})[0];return p?p.PROVEEDOR:o;}
function nuevoPed(){
  var cant={}, unidad={}, origen='CENTRAL', area='COCINA', filtro='todos';
  function baseArea(){ return DATA.insumos.filter(function(i){ return String(i.AREA||'').toUpperCase()===area && String(i.GRUPO||'PEDIDO').toUpperCase()!=='ACTIVO'; }); }
  function selN(){ return Object.keys(cant).filter(function(k){return cant[k]>0;}).length; }
  function updCount(){
    var n=selN();
    var ok=document.getElementById('npOk'); if(ok){ ok.textContent = n?('Crear pedido ('+n+')'):'Crear pedido'; ok.disabled = !n; }
    var ch=document.getElementById('chipSel'); if(ch) ch.textContent='🧺 Elegidos ('+n+')';
  }
  function draw(){
    var provTodos=DATA.proveedores.filter(function(p){return String(p.ACTIVO).toUpperCase()!=='NO';});
    var provPed=provTodos.filter(function(p){return String(p.PEDIDO).toUpperCase()==='SI';});
    var provs=provPed.length?provPed:provTodos;
    modal('<div class="mh">Nuevo pedido · '+sucName(SUC)+'</div><div class="mb" style="padding-bottom:6px">'+
      '<div class="segs" style="margin-bottom:8px">'+
        '<button class="seg'+(area==='COCINA'?' on':'')+'" onclick="setArea(\'COCINA\')">🍳 Cocina</button>'+
        '<button class="seg'+(area==='SALON'?' on':'')+'" onclick="setArea(\'SALON\')">🛎️ Salón</button>'+
      '</div>'+
      '<div class="field" style="margin-bottom:8px"><label>Pedir a</label><select id="npO"><option value="CENTRAL"'+(origen==='CENTRAL'?' selected':'')+'>🏭 Prod. Central</option>'+
        provs.map(function(p){return '<option value="'+esc(p.CODIGO)+'"'+(origen===p.CODIGO?' selected':'')+'>🚚 '+esc(p.PROVEEDOR)+'</option>';}).join('')+'</select></div>'+
      '<input id="npQ" class="npsearch" placeholder="🔎 Buscar…" autocomplete="off">'+
      '<div class="segs" style="margin-bottom:8px">'+
        '<button class="seg'+(filtro==='todos'?' on':'')+'" onclick="setFiltro(\'todos\')">Todos</button>'+
        '<button class="seg'+(filtro==='sel'?' on':'')+'" id="chipSel" onclick="setFiltro(\'sel\')">🧺 Elegidos ('+selN()+')</button>'+
      '</div>'+
      '<div id="npR" class="npr2"></div>'+
      '</div><div class="mf"><button class="btn ghost" onclick="cancelarPed()">Cancelar</button><button class="btn primary" id="npOk" onclick="okPed()">Crear pedido</button></div>', true);
    document.getElementById('npO').onchange=function(){origen=this.value;};
    var q=document.getElementById('npQ'), R=document.getElementById('npR');
    function paint(){
      var t=(q.value||'').toLowerCase().trim();
      var m=baseArea().filter(function(i){
        if(filtro==='sel' && !(cant[i.INSUMO]>0)) return false;
        return !t || String(i.INSUMO).toLowerCase().indexOf(t)>=0 || String(i.UNIDAD||'').toLowerCase().indexOf(t)>=0;
      });
      if(!m.length){ R.innerHTML='<div class="npi npempty">'+(filtro==='sel'?'Todavía no elegiste nada':'Sin resultados')+'</div>'; return; }
      var COMU=['un','kg','litros','gr','pack','bandeja','bidón','caja','paquete','mangas','placas','bolsa','maples'];
      var html='', catActual=null;
      m.forEach(function(i){
        if(unidad[i.INSUMO]===undefined) unidad[i.INSUMO]=i.UNIDAD||'un';
        var cur=unidad[i.INSUMO];
        var opts=[]; var seen={};
        [i.UNIDAD].concat(COMU).forEach(function(o){o=String(o||'').trim(); if(o&&!seen[o.toLowerCase()]){seen[o.toLowerCase()]=1;opts.push(o);}});
        var cat=String(i.CATEGORIA||'Otros');
        if(cat!==catActual){ catActual=cat; html+='<div class="npcat">'+esc(cat)+'</div>'; }
        var val=cant[i.INSUMO]>0?fmtCant(cant[i.INSUMO]):'';
        html+='<div class="npi2'+(val?' sel':'')+'"><span class="npi2n">'+esc(i.INSUMO)+'</span>'+
          '<input class="qin npq" inputmode="text" placeholder="cant." value="'+esc(val)+'" data-ins="'+esc(i.INSUMO)+'">'+
          '<select class="npq-u" data-ins="'+esc(i.INSUMO)+'">'+opts.map(function(o){return '<option'+(o===cur?' selected':'')+'>'+esc(o)+'</option>';}).join('')+'</select></div>';
      });
      R.innerHTML=html;
      Array.prototype.forEach.call(R.querySelectorAll('.npq'),function(el){
        el.oninput=function(){ var ins=this.getAttribute('data-ins'); var v=parseCant(this.value); if(v>0)cant[ins]=v; else delete cant[ins]; this.parentNode.classList.toggle('sel', v>0); updCount(); };
      });
      Array.prototype.forEach.call(R.querySelectorAll('.npq-u'),function(el){
        el.onchange=function(){ unidad[this.getAttribute('data-ins')]=this.value; };
      });
    }
    window.__paint=paint;
    if(q){q.oninput=paint;q.focus();}
    paint(); updCount();
  }
  window.setArea=function(a){var o=document.getElementById('npO');if(o)origen=o.value;area=a;draw();};
  window.setFiltro=function(f){filtro=f;draw();};
  window.cancelarPed=function(){ if(selN()>0 && !confirm('¿Cancelar el pedido? Se pierde lo que cargaste.')) return; closeM(); };
  window.okPed=async function(){
    var items=Object.keys(cant).filter(function(k){return cant[k]>0;}).map(function(k){return {insumo:k,unidad:unidad[k]||'',pedido:cant[k]};});
    if(!items.length){toast('Ponéle cantidad a algún insumo','danger');return;}
    origen=document.getElementById('npO').value;
    closeM();toast('Guardando…');await run('crearPedido')({local:SUC,origen:origen,area:area,usuario:USUARIO,items:items});await reload();toast('Pedido de '+(area==='COCINA'?'Cocina':'Salón')+' creado','pos');};
  draw();
}

/* ================= PERSONAL ================= */
function empSuc(e){return sucNorm(e.SUCURSAL);}
function hm(h){var p=String(h||'').split(':');return (+p[0]||0)*60+(+p[1]||0);}
function fichHoy(emp){return DATA.fichajes.filter(function(f){return f.EMPLEADO===emp&&String(f.FECHA)===DATA.hoy;}).sort(function(a,b){return String(a.HORA).localeCompare(String(b.HORA));});}
function estado(emp,horaEnt){var fs=fichHoy(emp);if(!fs.length)return{t:'Ausente',c:'mut'};var last=fs[fs.length-1];var ent=fs.filter(function(f){return f.TIPO==='entrada';})[0];if(last.TIPO==='salida')return{t:'Salió '+String(last.HORA).slice(0,5),c:'info',ent:ent};var tarde=ent&&hm(ent.HORA)>hm(horaEnt)+10;return{t:(tarde?'Tarde ':'Presente ')+(ent?String(ent.HORA).slice(0,5):''),c:tarde?'warn':'pos',ent:ent};}
function salHoy(emp){var s=fichHoy(emp).filter(function(f){return f.TIPO==='salida';});return s.length?String(s[s.length-1].HORA).slice(0,5):null;}
function salObj(emp){var s=fichHoy(emp).filter(function(f){return f.TIPO==='salida';});return s.length?s[s.length-1]:null;}
function manMark(f){return (f&&String(f.MODO)==='manual')?' <span class="tag warn" title="'+esc(f.MOTIVO||'Fichaje manual')+'" style="padding:0 5px;font-size:9px">M</span>':'';}
function horasPeriodo(emp,dias){
  var since=new Date();since.setDate(since.getDate()-(dias-1));var sIso=since.getFullYear()+'-'+('0'+(since.getMonth()+1)).slice(-2)+'-'+('0'+since.getDate()).slice(-2);
  var fs=DATA.fichajes.filter(function(f){return f.EMPLEADO===emp&&String(f.FECHA)>=sIso;}).sort(function(a,b){return String(a.FECHA+a.HORA).localeCompare(String(b.FECHA+b.HORA));});
  var byDay={};fs.forEach(function(f){(byDay[f.FECHA]=byDay[f.FECHA]||[]).push(f);});
  var min=0;Object.keys(byDay).forEach(function(d){var ent=null;byDay[d].forEach(function(f){if(f.TIPO==='entrada')ent=hm(f.HORA);else if(f.TIPO==='salida'&&ent!=null){min+=Math.max(0,hm(f.HORA)-ent);ent=null;}});});
  return min/60;
}
function mesActual(){return String(DATA.hoy||'').slice(0,7)||new Date().toISOString().slice(0,7);}
function horasMes(emp,mes){
  var fs=DATA.fichajes.filter(function(f){return f.EMPLEADO===emp&&String(f.FECHA).slice(0,7)===mes;}).sort(function(a,b){return String(a.FECHA+a.HORA).localeCompare(String(b.FECHA+b.HORA));});
  var byDay={};fs.forEach(function(f){(byDay[f.FECHA]=byDay[f.FECHA]||[]).push(f);});
  var det=[],tot=0;
  Object.keys(byDay).sort().forEach(function(d){var ent=null,min=0;byDay[d].forEach(function(f){if(f.TIPO==='entrada')ent=hm(f.HORA);else if(f.TIPO==='salida'&&ent!=null){min+=Math.max(0,hm(f.HORA)-ent);ent=null;}});tot+=min;det.push({dia:d,horas:min/60,man:byDay[d].some(function(x){return String(x.MODO)==='manual';})});});
  return {total:tot/60, dias:det};
}
function pagosMes(emp,mes){return DATA.pagos.filter(function(p){return p.EMPLEADO===emp&&String(p.FECHA).slice(0,7)===mes;}).sort(function(a,b){return String(a.FECHA).localeCompare(String(b.FECHA));});}
/* Horas fichadas en la app este mes, buscando el nombre de forma aproximada (HORARIOS vs EMPLEADOS). */
function horasFichadasMes(nombre){
  var u=String(nombre||'').toUpperCase().trim(); var mes=mesActual();
  var fs=DATA.fichajes.filter(function(f){var e=String(f.EMPLEADO||'').toUpperCase().trim();return (e===u||e.indexOf(u)>=0||u.indexOf(e)>=0)&&String(f.FECHA).slice(0,7)===mes;}).sort(function(a,b){return String(a.FECHA+a.HORA).localeCompare(String(b.FECHA+b.HORA));});
  var byDay={};fs.forEach(function(f){(byDay[f.FECHA]=byDay[f.FECHA]||[]).push(f);});
  var tot=0;Object.keys(byDay).forEach(function(d){var ent=null;byDay[d].forEach(function(f){if(f.TIPO==='entrada')ent=hm(f.HORA);else if(f.TIPO==='salida'&&ent!=null){tot+=Math.max(0,hm(f.HORA)-ent);ent=null;}});});
  return tot/60;
}

  M(rrhhTabs()+'<p class="sub">'+rows.length+' empleados · <a href="#" onclick="DATA.vaca=null;render();return false" style="color:var(--brand)">↻ recargar</a></p>'+

    '<div class="panel"><div class="sx"><table><tr><th>Empleado</th><th>Ingreso</th><th class="r">Antig.</th><th class="r">Días</th><th class="r">Gozados</th><th class="r">Restantes</th><th class="r">Monto</th><th class="r">Pendiente</th></tr>'+body+'</table></div></div>');
}
async function vLiquidacion(){
  if(!DATA.rrhh){
    M(rrhhTabs()+'<div class="load">Leyendo la liquidación…</div>');
    try{ DATA.rrhh=JSON.parse(await run('getRRHH')(deviceId())); }catch(e){ M(rrhhTabs()+'<div class="empty">No pude leer RRHH.</div>'); return; }
  }
  var rows=(DATA.rrhh&&DATA.rrhh.rows)||[];
  if(!rows.length){ M(rrhhTabs()+'<div class="empty">No encontré la liquidación.<br><small>Ejecutá <b>verHojas</b> y pasame el registro.</small></div>'); return; }
  var tBruto=0,tAdel=0,tNeto=0,tPag=0,tPend=0;
  rows.forEach(function(r){tBruto+=r.bruto;tAdel+=r.adel;tNeto+=r.neto;tPag+=r.pagado;tPend+=r.pend;});
  var deuda=rows.filter(function(r){return String(r.estado).toUpperCase().indexOf('DEUDA')>=0;}).length;
  var kpis='<div class="kpis">'+
    '<div class="kpi"><div class="kl">Total bruto</div><div class="kv">'+money(tBruto)+'</div></div>'+
    '<div class="kpi"><div class="kl">Adelantos</div><div class="kv">'+money(tAdel)+'</div></div>'+
    '<div class="kpi"><div class="kl">Pagado en el mes</div><div class="kv">'+money(tPag)+'</div></div>'+
    '<div class="kpi" style="border-color:var(--brand)"><div class="kl">Pendiente</div><div class="kv" style="color:var(--brand)">'+money(tPend)+'</div></div></div>';
  var body=rows.map(function(r){
    var deudaR=String(r.estado).toUpperCase().indexOf('DEUDA')>=0;
    return '<tr style="cursor:pointer" onclick="fichaRRHH(\''+esc(r.emp).replace(/'/g,"\\'")+'\')"><td style="font-weight:600">'+esc(r.emp)+' <span style="color:var(--faint);font-size:10px">ver ▸</span></td><td>'+esc(r.suc)+'</td><td><span class="tag mut">'+esc(r.rol)+'</span></td>'+
      '<td class="r mono">'+(r.vh?money(r.vh):'—')+'</td><td class="r mono">'+(r.hs||0)+'</td>'+
      '<td class="r mono">'+money(r.bruto)+'</td><td class="r mono">'+money(r.adel)+'</td>'+
      '<td class="r mono">'+money(r.pagado)+'</td>'+
      '<td class="r mono" style="font-weight:700'+(r.pend>0?';color:var(--warn)':'')+'">'+money(r.pend)+'</td>'+
      '<td><span class="tag '+(deudaR?'danger':'pos')+'">'+esc(r.estado||'—')+'</span></td></tr>';
  }).join('');
  M(rrhhTabs()+'<p class="sub">'+rows.length+' empleados'+(deuda?' · <b style="color:var(--danger)">'+deuda+' con deuda</b>':'')+' · tocá un empleado para su ficha · <a href="#" onclick="DATA.rrhh=null;render();return false" style="color:var(--brand)">↻ recargar</a></p>'+
    kpis+
    '<div class="panel"><div class="sx"><table><tr><th>Empleado</th><th>Suc</th><th>Rol</th><th class="r">V.Hora</th><th class="r">Hs</th><th class="r">Bruto</th><th class="r">Adelantos</th><th class="r">Pagado</th><th class="r">Pendiente</th><th>Estado</th></tr>'+body+'</table></div></div>');
}
function vhRRHH(emp){ var rr=(DATA.rrhh&&DATA.rrhh.rows)||[]; var x=rr.filter(function(r){return String(r.emp).toUpperCase().trim()===String(emp).toUpperCase().trim();})[0]; return x?x.vh:0; }
window.fichaRRHH=function(emp){
  var rr=(DATA.rrhh&&DATA.rrhh.rows)||[]; var r=rr.filter(function(x){return x.emp===emp;})[0]; if(!r)return;
  var fila=function(l,v,fuerte){return '<tr><td>'+l+'</td><td class="r mono"'+(fuerte?' style="font-weight:700"':'')+'>'+v+'</td></tr>';};
  modal('<div class="mh">Ficha · '+esc(emp)+'</div><div class="mb">'+
    '<p class="sub">'+esc(r.rol||'')+' · '+esc(r.suc||'')+'</p>'+
    '<div class="kpis"><div class="kpi"><div class="kl">Valor hora</div><div class="kv" style="font-size:16px">'+(r.vh?money(r.vh):'—')+'</div></div>'+
      '<div class="kpi"><div class="kl">Bruto</div><div class="kv" style="font-size:16px">'+money(r.bruto)+'</div></div>'+
      '<div class="kpi" style="border-color:var(--brand)"><div class="kl">Pendiente</div><div class="kv" style="font-size:16px;color:var(--brand)">'+money(r.pend)+'</div></div></div>'+
    '<table>'+
      fila('Valor hora base', r.vhbase?money(r.vhbase):'—')+
      fila('Valor hora ajustado', r.vh?money(r.vh):'—')+
      fila('Horas normales', (r.hs||0))+
      fila('Días trabajados', (r.dias||0))+
      fila('Importe normal', money(r.impnormal||r.bruto-r.extra))+
      fila('Extra responsable', money(r.extra))+
      fila('Bruto (con extra)', money(r.bruto), true)+
      fila('Descuentos', money(r.desc))+
      fila('Deuda mes anterior', money(r.deuda))+
      fila('Neto a pagar', money(r.neto), true)+
      fila('Adelantos', money(r.adel))+
      fila('Pagado — Banco/Transf', money(r.banco))+
      fila('Pagado — Efectivo', money(r.efvo))+
      fila('Total pagado en el mes', money(r.pagado), true)+
      fila('SAC / Aguinaldo (cuota)', money(r.sac))+
      '<tr style="font-weight:700;background:var(--surface-2)"><td>PENDIENTE</td><td class="r mono"'+(r.pend>0?' style="color:var(--warn)"':'')+'>'+money(r.pend)+'</td></tr>'+
    '</table>'+
    '<div style="margin-top:8px"><span class="tag '+(String(r.estado).toUpperCase().indexOf('DEUDA')>=0?'danger':'pos')+'">'+esc(r.estado||'—')+'</span></div>'+
    '</div><div class="mf"><button class="btn primary" onclick="closeM()">Cerrar</button></div>');
};

var PERIODO=7;
async function vPersonal(){
  var dueno=ROL==='dueno';
  if(!dueno && DEV_TIPO==='CELULAR'){ M('<h1>Personal</h1><div class="empty">💻 El fichaje se hace desde la <b>compu del local</b>.<br><small>Este dispositivo está habilitado solo para pedidos/remitos.</small></div>'); return; }
  if(dueno && !DATA.rrhh){ try{ DATA.rrhh=JSON.parse(await run('getRRHH')(deviceId())); }catch(e){ DATA.rrhh={rows:[]}; } }
  var emps=DATA.empleados.filter(function(e){return String(e.ACTIVO).toUpperCase()!=='NO'&&(dueno||empSuc(e)===SUC);});
  var head='<h1>Personal'+(dueno?'':' · '+sucName(SUC))+'</h1><p class="sub">Fichaje de entrada/salida y pagos · '+DATA.hoy+(dueno?'':' · solo tu sucursal')+'</p>';
  var kpi='';
  if(dueno){var act=DATA.empleados.filter(function(e){return String(e.ACTIVO).toUpperCase()!=='NO';});kpi='<div class="note">Total empleados: <b>'+act.length+'</b> · Este conteo lo ves solo vos.</div>';}
  var tabla='<div class="panel"><div class="ph">Empleados y fichaje de hoy</div><div class="sx"><table><tr><th>Empleado</th><th>Puesto</th>'+(dueno?'<th>Sucursal</th>':'')+'<th class="c">Horario</th><th>Entrada</th><th>Salida</th><th>Estado</th><th></th></tr>'+
    emps.map(function(e){var st=estado(e.EMPLEADO,e.HORA_ENTRADA);var pres=st.c==='pos'||st.c==='warn';var sal=salHoy(e.EMPLEADO);var so=salObj(e.EMPLEADO);
      return '<tr><td style="font-weight:600">'+esc(e.EMPLEADO)+'</td><td><span class="tag mut">'+esc(e.PUESTO)+'</span></td>'+(dueno?'<td>'+sucName(empSuc(e))+'</td>':'')+
      '<td class="c mono" style="color:var(--faint)">'+esc(e.HORA_ENTRADA)+'–'+esc(e.HORA_SALIDA)+'</td>'+
      '<td class="mono">'+(st.ent?String(st.ent.HORA).slice(0,5)+manMark(st.ent):'—')+'</td><td class="mono">'+(sal?sal+manMark(so):'—')+'</td><td><span class="tag '+st.c+'">'+st.t+'</span></td>'+
      '<td class="r" style="white-space:nowrap"><button class="btn '+(pres?'':'pos')+' sm" onclick="fichar(\''+esc(e.EMPLEADO)+'\')">'+(pres?'Fichar salida':'Fichar entrada')+'</button> <button class="btn ghost sm" title="Fichaje manual (sin la compu autorizada)" onclick="ficharManualUI(\''+esc(e.EMPLEADO)+'\')">✎ Manual</button>'+(dueno?' <button class="btn ghost sm" onclick="pagar(\''+esc(e.EMPLEADO)+'\')">Pagar</button>':'')+'</td></tr>';
    }).join('')+'</table></div></div>';
  var calc='';
  if(dueno){
    var rows=emps.map(function(e){var h=horasPeriodo(e.EMPLEADO,PERIODO);var vh=num(e.VALOR_HORA_RRHH)||vhRRHH(e.EMPLEADO);return {e:e,h:h,vh:vh,total:h*vh};});
    calc='<div class="panel"><div class="ph">Cálculo de pagos — solo dueño <span style="margin-left:auto"></span>'+
      '<button class="btn sm '+(PERIODO===7?'primary':'')+'" onclick="PERIODO=7;render()">Semana</button> <button class="btn sm '+(PERIODO===15?'primary':'')+'" onclick="PERIODO=15;render()">Quincena</button></div>'+
      '<div class="sx"><table><tr><th>Empleado</th><th class="r">Horas ('+PERIODO+'d)</th><th class="r">Valor hora</th><th class="r">A pagar</th><th></th></tr>'+
      rows.map(function(r){return '<tr><td style="font-weight:600">'+esc(r.e.EMPLEADO)+'</td><td class="r mono">'+r.h.toFixed(1)+'</td><td class="r mono">'+(r.vh?money(r.vh):'<span style="color:var(--warn)">falta</span>')+'</td><td class="r mono" style="font-weight:600">'+(r.vh?money(r.total):'—')+'</td><td class="r">'+(r.vh&&r.h>0?'<button class="btn pos sm" onclick="pagar(\''+esc(r.e.EMPLEADO)+'\','+Math.round(r.total)+',\''+(PERIODO===7?'Semanal':'Quincena')+'\')">Registrar</button>':'')+'</td></tr>';}).join('')+
      '</table></div><div style="padding:10px 14px;font-size:11.5px;color:var(--faint)">Horas = pares entrada/salida fichados. Valor hora = de EMPLEADOS (VALOR_HORA_RRHH) o, si está vacío, el de tu planilla RRHH.</div></div>';
  }
  M(head+kpi+tabla+calc);
}
window.fichar=async function(emp){toast('Fichando…');var r=await run('fichar')(emp);await reload();toast(emp.split(' ')[0]+' · '+r.tipo+' '+r.hora,'pos');};
window.ficharManualUI=function(emp){
  var st=estado(emp,''); var tipoSug=(st.c==='pos'||st.c==='warn')?'salida':'entrada';
  modal('<div class="mh">Fichaje manual · '+esc(emp.split(' ')[0])+'</div><div class="mb">'+
    '<div class="note">Usalo solo cuando no está la compu autorizada. Se anota la hora que pongas, y queda registrada la hora real en que lo cargaste (para control). El motivo es obligatorio.</div>'+
    '<div class="field"><label>Tipo</label><select id="fmT"><option value="entrada"'+(tipoSug==='entrada'?' selected':'')+'>Entrada</option><option value="salida"'+(tipoSug==='salida'?' selected':'')+'>Salida</option></select></div>'+
    '<div class="field"><label>Hora real de '+(tipoSug==='salida'?'salida':'entrada')+'</label><input id="fmH" type="time" value="08:00"></div>'+
    '<div class="field"><label>Motivo (obligatorio)</label><input id="fmM" placeholder="ej: entró 06:00 con permiso · compu del local sin conexión"></div>'+
    '</div><div class="mf"><button class="btn ghost" onclick="closeM()">Cancelar</button><button class="btn primary" onclick="okFichManual(\''+esc(emp).replace(/'/g,"\\'")+'\')">Guardar fichaje</button></div>');
};
window.okFichManual=async function(emp){
  var tipo=document.getElementById('fmT').value;
  var hora=document.getElementById('fmH').value;
  var motivo=(document.getElementById('fmM').value||'').trim();
  if(!hora){toast('Falta la hora','danger');return;}
  if(!motivo){toast('El motivo es obligatorio','danger');return;}
  closeM();toast('Guardando…');
  var r=await run('ficharManual')({empleado:emp,tipo:tipo,hora:hora,motivo:motivo});
  await reload();toast(emp.split(' ')[0]+' · '+r.tipo+' '+r.hora+' (manual)','pos');
};
window.pagar=function(emp,monto,tipo){
  var emps=DATA.empleados.filter(function(e){return String(e.ACTIVO).toUpperCase()!=='NO'&&(ROL==='dueno'||empSuc(e)===SUC);});
  var TP=['Semanal','Quincena','Adelanto','Sueldo','Premio','Horas extra','Aguinaldo'];
  modal('<div class="mh">Registrar pago</div><div class="mb">'+
    '<div class="field"><label>Empleado</label><select id="pgE">'+emps.map(function(e){return '<option'+(e.EMPLEADO===emp?' selected':'')+'>'+esc(e.EMPLEADO)+'</option>';}).join('')+'</select></div>'+
    '<div class="field"><label>Concepto</label><select id="pgT">'+TP.map(function(t){return '<option'+(t===tipo?' selected':'')+'>'+t+'</option>';}).join('')+'</select></div>'+
    '<div class="field"><label>Monto</label><input id="pgM" type="number" value="'+(monto||'')+'"></div>'+
    '<div class="field"><label>Nota</label><input id="pgN" placeholder="opcional"></div>'+
    '<div class="field"><label>Fecha</label><input id="pgF" type="date" value="'+DATA.hoy+'"></div></div>'+
    '<div class="mf"><button class="btn ghost" onclick="closeM()">Cancelar</button><button class="btn primary" onclick="okPago()">Registrar</button></div>');
  window.okPago=async function(){var m=num(document.getElementById('pgM').value);if(!m){toast('Ingresá el monto');return;}closeM();toast('Guardando…');
    await run('registrarPago')({empleado:document.getElementById('pgE').value,tipo:document.getElementById('pgT').value,monto:m,nota:document.getElementById('pgN').value,fecha:document.getElementById('pgF').value});await reload();toast('Pago registrado','pos');};
};

/* arranque — si arenacafe.ar nos pasó ?dev=ID, lo usamos como identificador fijo del aparato */
function boot(){
  try{
    google.script.url.getLocation(function(loc){
      try{ var d = loc && loc.parameter && loc.parameter.dev; if(d){ localStorage.setItem('pastaio_dev', String(d)); } }catch(e){}
      reload();
    });
  }catch(e){ reload(); }
}
boot();
</script>
